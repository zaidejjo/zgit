# CI build — runs on every push and pull request.
# Verifies Go compilation, tests, lint, and frontend build.
name: build

on:
  push:
    branches: [main, dev, feature/*]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.x'
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: go vet
        run: go vet ./...

      - name: go fmt
        run: test -z "$(go fmt ./...)" || (echo "go fmt found unformatted files — run 'go fmt ./...'"; exit 1)

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: go test ./... -count=1 -timeout=120s

  build-tui:
    name: Build TUI (Linux amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build zgit binary
        run: go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o zgit ./cmd/zgit/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zgit-linux-amd64
          path: zgit

  build-desktop:
    name: Build Desktop (Linux amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build desktop app
        run: |
          cd desktop
          wails build -clean -skipbindings -tags webkit2_41 -ldflags="-s -w -X main.Version=${{ github.ref_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zgit-desktop-linux-amd64
          path: desktop/build/bin/zgit-desktop
