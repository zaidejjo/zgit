# Build — smoke builds on the road to main (PR → main, push → main).
# Proves every shipped binary compiles. Shipped artifacts are rebuilt
# from the release tag by release.yml — never taken from here.
name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.x'
  BUN_VERSION: '1.4.0'
  WAILS_VERSION: 'v2.13.0'

jobs:
  tui-matrix:
    name: TUI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build TUI binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o zgit-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/zgit/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zgit-tui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: zgit-*
          if-no-files-found: error
          retention-days: 7

  desktop-linux:
    name: Desktop (Linux amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ hashFiles('desktop/frontend/bun.lock') }}
          restore-keys: |
            bun-store-${{ runner.os }}-

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails CLI (cached)
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails
          key: wails-${{ env.WAILS_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Wails CLI (on cache miss)
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build desktop app
        run: |
          cd desktop
          wails build -clean -skipbindings -tags webkit2_41 -ldflags="-s -w"

  cli-smoke:
    name: CLI Smoke Test
    runs-on: ubuntu-latest
    needs: [tui-matrix]
    steps:
      - name: Download linux/amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: zgit-tui-linux-amd64
          path: ./smoke

      - name: Exercise worktree + status against a temp repo
        run: |
          set -euo pipefail
          chmod +x ./smoke/zgit-linux-amd64
          export GIT_AUTHOR_NAME=t GIT_AUTHOR_EMAIL=t@t.co
          export GIT_COMMITTER_NAME=t GIT_COMMITTER_EMAIL=t@t.co
          rm -rf /tmp/smoke-repo /tmp/smoke-linked
          git init -q -b main /tmp/smoke-repo
          git -C /tmp/smoke-repo commit -q --allow-empty -m init
          ./smoke/zgit-linux-amd64 -C /tmp/smoke-repo worktree list
          ./smoke/zgit-linux-amd64 -C /tmp/smoke-repo worktree add /tmp/smoke-linked --new-branch smoke/x
          ./smoke/zgit-linux-amd64 -C /tmp/smoke-repo worktree list | grep -q smoke/x
          ./smoke/zgit-linux-amd64 -C /tmp/smoke-repo status
          ./smoke/zgit-linux-amd64 -C /tmp/smoke-repo worktree remove /tmp/smoke-linked --force
          echo SMOKE_OK
