# Release workflow — triggered ONLY by tag push v*.*.*.
# Tag = single source of truth: `git tag vX.Y.Z && git push origin vX.Y.Z`
# (after merging the release to main).
# Always creates/updates the GitHub Release with every platform binary,
# then publishes both AUR packages from the release tarballs.
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.x'
  BUN_VERSION: '1.4.0'

jobs:
  goreleaser:
    name: GoReleaser (TUI — all platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal token with `repo` scope: pushes the Homebrew cask
          # into zaidejjo/homebrew-tap (GITHUB_TOKEN cannot cross repos).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  desktop-matrix:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            arch: amd64
            bin: zgit
            bundle: ''
            wails_tags: webkit2_41
            pkg_ext: tar.gz
          - os: darwin
            runner: macos-latest
            arch: arm64
            bin: zgit.app/Contents/MacOS/zgit
            bundle: zgit.app
            wails_tags: ''
            pkg_ext: tar.gz
          - os: windows
            runner: windows-latest
            arch: amd64
            bin: zgit.exe
            bundle: ''
            wails_tags: ''
            pkg_ext: zip
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Linux system deps
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build desktop app
        shell: bash
        run: |
          TAGS=""
          if [ -n "${{ matrix.wails_tags }}" ]; then TAGS="-tags ${{ matrix.wails_tags }}"; fi
          cd desktop
          # shellcheck disable=SC2086
          wails build -clean -skipbindings $TAGS -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v}"

      - name: Package artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BIN="desktop/build/bin/${{ matrix.bin }}"
          test -f "$BIN" || { echo "expected binary missing: $BIN"; ls -la desktop/build/bin/; exit 1; }
          rm -rf dist/stage && mkdir -p dist/stage dist
          if [ -n "${{ matrix.bundle }}" ]; then
            # macOS: ship the whole .app bundle (Linux .desktop files don't apply).
            cp -r "desktop/build/bin/${{ matrix.bundle }}" dist/stage/
          else
            cp "$BIN" "dist/stage/${{ matrix.bin }}"
            if [ "${{ matrix.os }}" = "linux" ]; then
              cp images/logo_512.png dist/stage/zgit.png
              cp dist/aur/zgit-desktop-bin/zgit.desktop dist/stage/
              cp dist/flatpak/com.zaidejjo.zgit.metainfo.xml dist/stage/
            fi
          fi
          if [ "${{ matrix.pkg_ext }}" = "zip" ]; then
            (cd dist/stage && 7z a "../zgit-desktop-v${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.zip" .)
          else
            tar czf "dist/zgit-desktop-v${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C dist/stage .
          fi
          # Per-artifact checksum sidecar (release checksums.txt only covers
          # GoReleaser archives; the install script verifies against this).
          cd dist
          for f in zgit-desktop-v${VERSION}-*; do
            case "$f" in *.sha256) continue;; esac
            sha256sum "$f" > "$f.sha256"
          done

      - name: Upload release assets (same GitHub Release, always)
        # Exact per-OS patterns: a combined tar.gz+zip glob fails the job
        # when only one format exists (fail_on_unmatched_files).
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zgit-desktop-v*-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.pkg_ext }}
            dist/zgit-desktop-v*-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.pkg_ext }}.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-aur:
    name: Publish to AUR
    needs: [goreleaser, desktop-matrix]
    runs-on: ubuntu-latest
    if: github.repository == 'zaidejjo/zgit'
    steps:
      - uses: actions/checkout@v4

      - name: Download release tarballs
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "zgit-v*.tar.gz" \
            --pattern "zgit-desktop-v*.tar.gz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch zgit-bin PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(sha256sum "zgit-v${VERSION}-linux-amd64.tar.gz" | cut -d' ' -f1)
          sed -i "s/__VERSION__/${VERSION}/g" dist/aur/zgit-bin/PKGBUILD
          sed -i "s/__SHA256SUM__/${SHA256}/g" dist/aur/zgit-bin/PKGBUILD

      - name: Publish zgit-bin to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: zgit-bin
          pkgbuild: dist/aur/zgit-bin/PKGBUILD
          commit_username: ${{ github.actor }}
          commit_email: ${{ github.actor }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.AUR_SSH_HOST_KEY }}

      - name: Patch zgit-desktop-bin PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(sha256sum "zgit-desktop-v${VERSION}-linux-amd64.tar.gz" | cut -d' ' -f1)
          sed -i "s/__VERSION__/${VERSION}/g" dist/aur/zgit-desktop-bin/PKGBUILD
          sed -i "s/__SHA256SUM__/${SHA256}/g" dist/aur/zgit-desktop-bin/PKGBUILD

      - name: Publish zgit-desktop-bin to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: zgit-desktop-bin
          pkgbuild: dist/aur/zgit-desktop-bin/PKGBUILD
          commit_username: ${{ github.actor }}
          commit_email: ${{ github.actor }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.AUR_SSH_HOST_KEY }}

  brew-smoke:
    name: Brew install smoke (macOS)
    needs: [goreleaser]
    runs-on: macos-latest
    steps:
      - name: Install zgit from tap
        run: |
          brew tap zaidejjo/tap
          # Third-party taps are untrusted by default; casks refuse to load.
          brew trust zaidejjo/tap
          brew install --cask zgit

      - name: Run installed binary
        run: zgit --help

  deb:
    name: Debian packages
    needs: [goreleaser]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            deb_arch: amd64
          - arch: arm64
            deb_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Download linux tarball
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "zgit-v*-linux-${{ matrix.arch }}.tar.gz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build .deb with dpkg-deb
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="zgit-v${VERSION}-linux-${{ matrix.arch }}.tar.gz"
          test -f "$TARBALL" || { echo "missing $TARBALL"; exit 1; }
          PKGDIR="pkg/zgit_${VERSION}_${{ matrix.deb_arch }}"
          rm -rf pkg && mkdir -p "$PKGDIR/DEBIAN" "$PKGDIR/usr/bin" "$PKGDIR/usr/share/doc/zgit"
          tar xzf "$TARBALL" -C /tmp
          cp /tmp/zgit "$PKGDIR/usr/bin/zgit"
          chmod 755 "$PKGDIR/usr/bin/zgit"
          cp LICENSE README.md "$PKGDIR/usr/share/doc/zgit/"
          cat > "$PKGDIR/DEBIAN/control" <<CONTROL
          Package: zgit
          Version: ${VERSION}
          Section: vcs
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: zaidejjo
          Depends: git
          Description: Modern, fast Git and GitHub client
           TUI and desktop companion for Git and GitHub workflows:
           status, log, branches, worktrees, PRs, issues and AI assistance.
          CONTROL
          dpkg-deb --build "$PKGDIR" "zgit_${VERSION}_${{ matrix.deb_arch }}.deb"
          dpkg-deb --info "zgit_${VERSION}_${{ matrix.deb_arch }}.deb"
          dpkg-deb --contents "zgit_${VERSION}_${{ matrix.deb_arch }}.deb"

      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: zgit_*.deb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apt-repo:
    name: Publish APT repository
    needs: [deb]
    runs-on: ubuntu-latest
    if: github.repository == 'zaidejjo/zgit'
    steps:
      - name: Checkout apt repo (PAT has cross-repo write)
        uses: actions/checkout@v4
        with:
          repository: zaidejjo/apt
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: apt

      - name: Download .debs from release
        run: |
          mkdir -p apt/pool
          cd apt/pool
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "zgit_*.deb" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          test -n "$APT_GPG_PRIVATE_KEY" || { echo "missing secret APT_GPG_PRIVATE_KEY"; exit 1; }
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --armor --export > apt/key.asc
          echo "key fingerprint: $(gpg --batch --list-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"

      - name: Rebuild Packages index + signed Release
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd apt
          sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils
          for arch in amd64 arm64; do
            mkdir -p "dists/stable/main/binary-$arch"
          done
          # One multi-arch Packages file served per arch dir (apt filters by Architecture field).
          apt-ftparchive packages pool/ > dists/stable/main/binary-amd64/Packages
          cp dists/stable/main/binary-amd64/Packages dists/stable/main/binary-arm64/Packages
          gzip -kf dists/stable/main/binary-amd64/Packages dists/stable/main/binary-arm64/Packages
          apt-ftparchive -c dists/stable/Release.conf release dists/stable > dists/stable/Release
          SIGN_ARGS=(--batch --yes --pinentry-mode loopback)
          if [ -n "${APT_GPG_PASSPHRASE:-}" ]; then
            SIGN_ARGS+=(--passphrase "$APT_GPG_PASSPHRASE")
          fi
          gpg "${SIGN_ARGS[@]}" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg "${SIGN_ARGS[@]}" -abs -o dists/stable/Release.gpg dists/stable/Release

      - name: Push updated repo
        run: |
          cd apt
          git add -A
          # NOTE: git -c requires name=value form (space-separated eats the value).
          export GIT_AUTHOR_NAME="${{ github.actor }}"
          export GIT_AUTHOR_EMAIL="${{ github.actor }}@users.noreply.github.com"
          export GIT_COMMITTER_NAME="${{ github.actor }}"
          export GIT_COMMITTER_EMAIL="${{ github.actor }}@users.noreply.github.com"
          git commit -m "apt: publish ${GITHUB_REF_NAME}" || echo "nothing to commit"
          git push origin HEAD:main
