# Release workflow — triggered by tag push v*.*.*
# Builds TUI + Desktop binaries for Linux AMD64.
# Creates a GitHub Release with all artifacts attached.
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  GO_VERSION: '1.26.x'
  NODE_VERSION: '20'

jobs:
  goreleaser:
    name: GoReleaser (TUI — Linux amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --dirty
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-linux:
    name: Desktop — Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build desktop app
        run: |
          cd desktop
          wails build -clean -skipbindings -tags webkit2_41 \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v}"

      - name: Package artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp desktop/build/bin/zgit-desktop "dist/zgit-desktop-v${VERSION}-linux-amd64"
          cp images/logo_512.png dist/zgit.png
          cp dist/aur/zgit-desktop-bin/zgit.desktop dist/
          cp dist/flatpak/com.zaidejjo.zgit.metainfo.xml dist/
          cd dist
          tar czf "zgit-desktop-v${VERSION}-linux-amd64.tar.gz" \
            "zgit-desktop-v${VERSION}-linux-amd64" \
            zgit.png zgit.desktop com.zaidejjo.zgit.metainfo.xml

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zgit-desktop-v*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-aur:
    name: Publish to AUR
    needs: [goreleaser, desktop-linux]
    runs-on: ubuntu-latest
    if: github.repository == 'zaidejjo/zgit'
    steps:
      - uses: actions/checkout@v4

      - name: Download release tarballs
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "zgit-v*.tar.gz" \
            --pattern "zgit-desktop-v*.tar.gz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch zgit-bin PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(sha256sum "zgit-v${VERSION}-linux-amd64.tar.gz" | cut -d' ' -f1)
          sed -i "s/__VERSION__/${VERSION}/g" dist/aur/zgit-bin/PKGBUILD
          sed -i "s/__SHA256SUM__/${SHA256}/g" dist/aur/zgit-bin/PKGBUILD

      - name: Publish zgit-bin to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: zgit-bin
          pkgbuild: dist/aur/zgit-bin/PKGBUILD
          commit_username: ${{ github.actor }}
          commit_email: ${{ github.actor }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.AUR_SSH_HOST_KEY }}

      - name: Patch zgit-desktop-bin PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(sha256sum "zgit-desktop-v${VERSION}-linux-amd64.tar.gz" | cut -d' ' -f1)
          sed -i "s/__VERSION__/${VERSION}/g" dist/aur/zgit-desktop-bin/PKGBUILD
          sed -i "s/__SHA256SUM__/${SHA256}/g" dist/aur/zgit-desktop-bin/PKGBUILD

      - name: Publish zgit-desktop-bin to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: zgit-desktop-bin
          pkgbuild: dist/aur/zgit-desktop-bin/PKGBUILD
          commit_username: ${{ github.actor }}
          commit_email: ${{ github.actor }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.AUR_SSH_HOST_KEY }}
