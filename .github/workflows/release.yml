# Release workflow — triggered ONLY by tag push v*.*.*.
# Tag = single source of truth: `git tag vX.Y.Z && git push origin vX.Y.Z`
# (after merging the release to main).
# Always creates/updates the GitHub Release with every platform binary,
# then publishes both AUR packages from the release tarballs.
name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.x'
  BUN_VERSION: '1.4.0'

jobs:
  goreleaser:
    name: GoReleaser (TUI — all platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-matrix:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            arch: amd64
            bin: zgit
            wails_tags: webkit2_41
            pkg_ext: tar.gz
          - os: darwin
            runner: macos-latest
            arch: arm64
            bin: zgit
            wails_tags: ''
            pkg_ext: tar.gz
          - os: windows
            runner: windows-latest
            arch: amd64
            bin: zgit.exe
            wails_tags: ''
            pkg_ext: zip
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Linux system deps
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build desktop app
        shell: bash
        run: |
          TAGS=""
          if [ -n "${{ matrix.wails_tags }}" ]; then TAGS="-tags ${{ matrix.wails_tags }}"; fi
          cd desktop
          # shellcheck disable=SC2086
          wails build -clean -skipbindings $TAGS -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v}"

      - name: Package artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BIN="desktop/build/bin/${{ matrix.bin }}"
          test -f "$BIN" || { echo "expected binary missing: $BIN"; ls -la desktop/build/bin/; exit 1; }
          rm -rf dist/stage && mkdir -p dist/stage dist
          cp "$BIN" "dist/stage/${{ matrix.bin }}"
          cp images/logo_512.png dist/stage/zgit.png
          cp dist/aur/zgit-desktop-bin/zgit.desktop dist/stage/
          cp dist/flatpak/com.zaidejjo.zgit.metainfo.xml dist/stage/
          if [ "${{ matrix.pkg_ext }}" = "zip" ]; then
            (cd dist/stage && 7z a "../zgit-desktop-v${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.zip" .)
          else
            tar czf "dist/zgit-desktop-v${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C dist/stage .
          fi

      - name: Upload release assets (same GitHub Release, always)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zgit-desktop-v*.tar.gz,dist/zgit-desktop-v*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-aur:
    name: Publish to AUR
    needs: [goreleaser, desktop-matrix]
    runs-on: ubuntu-latest
    if: github.repository == 'zaidejjo/zgit'
    steps:
      - uses: actions/checkout@v4

      - name: Download release tarballs
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "zgit-v*.tar.gz" \
            --pattern "zgit-desktop-v*.tar.gz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch zgit-bin PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(sha256sum "zgit-v${VERSION}-linux-amd64.tar.gz" | cut -d' ' -f1)
          sed -i "s/__VERSION__/${VERSION}/g" dist/aur/zgit-bin/PKGBUILD
          sed -i "s/__SHA256SUM__/${SHA256}/g" dist/aur/zgit-bin/PKGBUILD

      - name: Publish zgit-bin to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: zgit-bin
          pkgbuild: dist/aur/zgit-bin/PKGBUILD
          commit_username: ${{ github.actor }}
          commit_email: ${{ github.actor }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.AUR_SSH_HOST_KEY }}

      - name: Patch zgit-desktop-bin PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(sha256sum "zgit-desktop-v${VERSION}-linux-amd64.tar.gz" | cut -d' ' -f1)
          sed -i "s/__VERSION__/${VERSION}/g" dist/aur/zgit-desktop-bin/PKGBUILD
          sed -i "s/__SHA256SUM__/${SHA256}/g" dist/aur/zgit-desktop-bin/PKGBUILD

      - name: Publish zgit-desktop-bin to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: zgit-desktop-bin
          pkgbuild: dist/aur/zgit-desktop-bin/PKGBUILD
          commit_username: ${{ github.actor }}
          commit_email: ${{ github.actor }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.AUR_SSH_HOST_KEY }}
