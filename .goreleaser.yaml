# GoReleaser configuration for zgit TUI binary.
# Used by the release workflow to cross-compile for all platforms.
version: 2

project_name: zgit

before:
  hooks:
    - go mod tidy

builds:
  - id: zgit
    main: ./cmd/zgit/
    binary: zgit
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: tarball
    name_template: >-
      {{ .ProjectName }}-v{{ .Version }}-{{ if eq .Os "darwin" }}darwin{{ else }}{{ .Os }}{{ end }}-{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - merge conflict
      - Merge pull request
      - Merge remote-tracking branch

release:
  # Assets uploaded via separate desktop jobs; goreleaser only handles TUI.
  header: |
    ## zgit {{ .Version }} — Release Notes

    ### TUI Binary (Cross-platform)

    Download the TUI binary for your platform below.

    Desktop binaries are uploaded separately by the CI workflow.
  footer: |
    ---

    Full changelog: https://github.com/zaidejjo/zgit/compare/{{ .PreviousTag }}...{{ .Tag }}
