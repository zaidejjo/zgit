# GoReleaser configuration for zgit TUI binary.
# Used by the release workflow (tag push v*) to cross-compile for all platforms.
version: 2

project_name: zgit

before:
  hooks:
    - go mod tidy

builds:
  - id: zgit
    main: ./cmd/zgit/
    binary: zgit
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on ARM has no demand for a TUI git client; skip to save release time.
      - goos: windows
        goarch: arm64

archives:
  - id: tarball
    name_template: "{{ .ProjectName }}-v{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats: ['tar.gz']
    format_overrides:
      - goos: windows
        formats: ['zip']
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

homebrew_casks:
  - name: zgit
    repository:
      owner: zaidejjo
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/zaidejjo/zgit
    description: Modern, fast Git and GitHub client (TUI)
    binaries:
      - zgit

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - merge conflict
      - Merge pull request
      - Merge remote-tracking branch

release:
  github:
    owner: zaidejjo
    name: zgit
  # Desktop binaries are attached to the same GitHub Release by the
  # desktop-matrix job in release.yml; goreleaser only handles TUI.
  header: |
    ## zgit {{ .Version }} — Release Notes

    ### TUI Binary (Cross-platform)

    Download the TUI binary for your platform below.

    Desktop binaries are attached to this release by the CI workflow.
  footer: |
    ---

    Full changelog: https://github.com/zaidejjo/zgit/compare/{{ .PreviousTag }}...{{ .Tag }}
